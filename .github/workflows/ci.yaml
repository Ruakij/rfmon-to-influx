name: ci

on:
  push:
    branches: [master]
  pull_request:
  # A CVE published after a merge is still our problem, so rescan daily.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A push supersedes the run of the commit before it, so drop that one instead of
# waiting for a verdict on code nobody has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: rfmon-to-influx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Without configuration the program must stop on the missing variables of the
      # selected export method; that proves node, the dependencies and the entrypoint
      # work, and that USE_INFLUXDB_LINEPROTOCOL selects the method.
      - name: Start the image without configuration
        run: |
          expect_missing() {
            local want=$1; shift
            local out status
            set +e
            out=$(docker run --rm "$@" rfmon-to-influx:ci 2>&1)
            status=$?
            set -e
            echo "${out}"
            [ "${status}" -eq 1 ] && grep -q "Required ENV variables are not set: .*${want}" <<<"${out}"
          }
          expect_missing INFLUX_URL
          expect_missing INFLUX_URL -e USE_INFLUXDB_LINEPROTOCOL=false
          expect_missing INFLUXDB_LINEPROTOCOL_HOST -e USE_INFLUXDB_LINEPROTOCOL=true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rfmon-to-influx:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
